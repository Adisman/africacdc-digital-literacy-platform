# Production-style stack: the app (behind Caddy, which provides automatic HTTPS with TLS 1.3 and HTTP/2/3).
# 1) cp .env.example .env   2) fill in the secrets   3) set DOMAIN in .env   4) docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { TRUST_PROXY: "1", HOST: "0.0.0.0", PORT: "8080", DATA_DIR: /data }
    volumes: [ "dlp-data:/data" ]
    expose: [ "8080" ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [ app ]
    ports: [ "80:80", "443:443", "443:443/udp" ]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [ "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config" ]
volumes: { dlp-data: {}, caddy-data: {}, caddy-config: {} }
